name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -5
      - name: Start backend for UI tests
        working-directory: backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python seed.py
          nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8000/health
      - name: Build and test (simulator, no signing)
        run: |
          set -o pipefail
          # Use whichever iPhone simulator this runner image has.
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "Using simulator $UDID"
          xcodebuild test \
            -project Loopr.xcodeproj -scheme Loopr \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log
      - name: Print compile errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -60
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: /tmp/loopr-shots/
          if-no-files-found: warn
      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
